# ===== TROUBLESHOOTING =====
TROUBLESHOOTING:
  # Common issues and solutions
  COMMON_ISSUES:
    knowledge_base_sync_failed:
      description: "Knowledge base synchronization failed"
      solutions:
        - "Check S3 bucket permissions"
        - "Verify IAM role policies"
        - "Ensure document formats are supported"
    
    lambda_timeout:
      description: "Lambda function timeout errors"
      solutions:
        - "Increase timeout settings to 60 seconds"
        - "Optimize document retrieval queries"
        - "Implement proper error handling"
    
    poor_retrieval_quality:
      description: "Retrieved documents not relevant"
      solutions:
        - "Adjust chunking parameters"
        - "Improve document metadata"
        - "Fine-tune search queries"

