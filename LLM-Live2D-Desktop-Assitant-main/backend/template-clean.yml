AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Live2D Assistant - minimal backend with RAG infrastructure

Parameters:
  Env:
    Type: String
    Default: dev

  EnableRagInfra:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Set to "true" to also create OpenSearch and KB role (requires es/* and IAM permissions)

  ModelId:
    Type: String
    Default: arn:aws:bedrock:us-west-2:615299772411:inference-profile/us.anthropic.claude-3-7-sonnet-20250219-v1:0
    Description: Bedrock model/inference profile ARN

Conditions:
  CreateRagInfra: !Equals [!Ref EnableRagInfra, "true"]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Tracing: Active

Resources:
  # ---------- DynamoDB ----------
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TableName: !Sub live2d-connections-${Env}

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TableName: !Sub live2d-sessions-${Env}

  # ---------- S3 (auto-named to avoid collisions) ----------
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Owner
          Value: Live2DAssistant
        - Key: Environment
          Value: !Ref Env

  # ---------- (Optional) RAG Infra ----------
  VectorSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Condition: CreateRagInfra
    Properties:
      DomainName: !Sub "vtuber-vectors-${Env}"
      EngineVersion: "OpenSearch_2.3"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 20
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/vtuber-vectors-${Env}/*"

  BedrockKBRole:
    Type: AWS::IAM::Role
    Condition: CreateRagInfra
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockKBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentsBucket.Arn
                  - !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpGet
                  - es:ESHttpDelete
                  - es:ESHttpHead
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/vtuber-vectors-${Env}/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v1"
                  - "arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v2"

  # ---------- Lambdas ----------
  WSConnectionsFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles $connect/$disconnect; tracks connectionIds
      Handler: index.lambda_handler
      InlineCode: |
        import os, boto3
        ddb = boto3.resource("dynamodb")
        table = ddb.Table(os.environ["TABLE_CONNECTIONS"])
        def lambda_handler(event, context):
            rc = event.get("requestContext", {})
            route = rc.get("routeKey")
            cid = rc.get("connectionId")
            if route == "$connect":
                table.put_item(Item={"connectionId": cid})
                return {"statusCode": 200}
            if route == "$disconnect":
                table.delete_item(Key={"connectionId": cid})
                return {"statusCode": 200}
            return {"statusCode": 200}
      Environment:
        Variables:
          TABLE_CONNECTIONS: !Ref ConnectionsTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  OrchestratorFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: WS chat echo (stub) - streams two deltas + done
      Handler: index.lambda_handler
      InlineCode: |
        import json, boto3
        def lambda_handler(event, context):
            rc = event["requestContext"]
            domain = f"https://{rc['domainName']}/{rc['stage']}"
            cid = rc["connectionId"]
            api = boto3.client("apigatewaymanagementapi", endpoint_url=domain)
            body = json.loads(event.get("body") or "{}")
            txt = str(body.get("text") or "hello world")
            mid = max(1, len(txt)//2)
            api.post_to_connection(ConnectionId=cid, Data=json.dumps({"type":"assistant_text_delta","text":txt[:mid]}).encode())
            api.post_to_connection(ConnectionId=cid, Data=json.dumps({"type":"assistant_text_delta","text":txt[mid:]}).encode())
            api.post_to_connection(ConnectionId=cid, Data=json.dumps({"type":"assistant_done"}).encode())
            return {"statusCode": 200}
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/@connections/*

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: HTTP /health endpoint
      Handler: index.lambda_handler
      InlineCode: |
        import json
        def lambda_handler(event, context):
            return {"statusCode":200,"headers":{"content-type":"application/json"},"body":json.dumps({"status":"ok"})}
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health

  ClaudeHttpFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: HTTP POST /claude with RAG support
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 1024
      InlineCode: |
        import json, os, boto3
        from typing import List, Dict, Any

        BEDROCK_REGION = os.environ.get("BEDROCK_REGION", os.environ.get("AWS_REGION", "us-west-2"))
        MODEL_ID = os.environ.get("MODEL_ID")
        MAX_TOKENS = int(os.environ.get("MAX_TOKENS", "2048"))
        KNOWLEDGE_BASE_ID = os.environ.get("KNOWLEDGE_BASE_ID", "")

        bedrock_runtime = boto3.client("bedrock-runtime", region_name=BEDROCK_REGION)
        bedrock_agent = boto3.client("bedrock-agent-runtime", region_name=BEDROCK_REGION) if KNOWLEDGE_BASE_ID else None

        def retrieve_documents(query_text: str) -> List[Dict[str, Any]]:
            if not bedrock_agent or not KNOWLEDGE_BASE_ID:
                return []
            try:
                resp = bedrock_agent.retrieve(
                    knowledgeBaseId=KNOWLEDGE_BASE_ID,
                    retrievalQuery={"text": query_text},
                    retrievalConfiguration={"vectorSearchConfiguration": {"numberOfResults": 5, "overrideSearchType": "HYBRID"}}
                )
                out=[]
                for r in resp.get("retrievalResults", []):
                    out.append({"content": r["content"]["text"], "source": r["metadata"].get("source","Unknown"), "score": r["score"]})
                return out
            except Exception as e:
                print("[RAG] retrieve error:", e)
                return []

        def enhance_prompt_with_context(q: str, docs: List[Dict[str, Any]]) -> str:
            if not docs: return q
            parts = ["RELEVANT MANUFACTURING DOCS:"]
            for i,d in enumerate(docs,1):
                parts.append(f"{i}. Source: {d['source']}")
                parts.append(f"   Content: {d['content'][:500]}...")
                parts.append("")
            parts.append("QUESTION:"); parts.append(q)
            return "\n".join(parts)

        def lambda_handler(event, context):
            headers = {"content-type":"application/json","Access-Control-Allow-Origin":"*","Access-Control-Allow-Methods":"POST, OPTIONS","Access-Control-Allow-Headers":"Content-Type"}
            if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                return {"statusCode":200,"headers":headers,"body":""}

            body = json.loads(event.get("body") or "{}")
            text = (body.get("text") or "").strip()
            system = body.get("system","You are a helpful manufacturing assistant with access to technical documentation.")
            messages = body.get("messages", [])
            image_data = body.get('image')
            has_vision = body.get('has_vision', False)
            enable_rag = body.get('enable_rag', bool(KNOWLEDGE_BASE_ID))

            if not text and not messages:
                return {"statusCode":400,"headers":headers,"body":json.dumps({"error":"Either `text` or `messages` is required"})}

            docs=[]; enhanced=text
            if enable_rag and text and not has_vision:
                docs = retrieve_documents(text)
                if docs: enhanced = enhance_prompt_with_context(text, docs)

            if has_vision and image_data:
                content = [{"type":"text","text": text},
                           {"type":"image","source":{"type":"base64","media_type":"image/jpeg","data": image_data}}]
                bedrock_messages = [{"role":"user","content":content}]
                max_tok=1500
            else:
                if enhanced and not messages:
                    messages=[{"role":"user","content": enhanced}]
                bedrock_messages=[{"role": m.get("role","user"), "content":[{"type":"text","text": m.get("content","")}]} for m in messages]
                max_tok=MAX_TOKENS

            payload={"anthropic_version":"bedrock-2023-05-31","max_tokens": max_tok,"messages": bedrock_messages,"temperature":0.7}
            if system: payload["system"]=system

            resp = bedrock_runtime.invoke_model(modelId=MODEL_ID, contentType="application/json", accept="application/json", body=json.dumps(payload))
            data = json.loads(resp["body"].read())
            reply = data["content"][0]["text"]

            if docs and any(("safety" in d["source"].lower()) or ("critical" in d["content"].lower()) for d in docs):
                reply = "WARNING: This response contains safety-critical information. Follow all safety protocols.\n\n" + reply

            return {"statusCode":200,"headers":headers,"body":json.dumps({"reply": reply,"sources_used": len(docs),"rag_enabled": bool(KNOWLEDGE_BASE_ID) and len(docs)>0,"retrieved_sources": [d["source"] for d in docs]})}
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          BEDROCK_REGION: !Ref AWS::Region
          MAX_TOKENS: "2048"
          KNOWLEDGE_BASE_ID: ""
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock-agent:Retrieve
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !GetAtt DocumentsBucket.Arn
                - !Sub "${DocumentsBucket.Arn}/*"
      Events:
        ClaudeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /claude
        ClaudeOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: OPTIONS
            Path: /claude

  # ---------- APIs ----------
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub live2d-ws-${Env}
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WSConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WSConnectionsFn.Arn}/invocations

  WSDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WSConnectionsFn.Arn}/invocations

  WSChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrchestratorFn.Arn}/invocations

  WSRouteConnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${WSConnectIntegration}

  WSRouteDisconnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WSDisconnectIntegration}

  WSRouteChat:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: chat
      AuthorizationType: NONE
      Target: !Sub integrations/${WSChatIntegration}

  WSDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WSRouteConnect
      - WSRouteDisconnect
      - WSRouteChat
    Properties:
      ApiId: !Ref WebSocketApi

  WSStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Env
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WSDeployment

  LambdaPermConnect:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WSConnectionsFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  LambdaPermChat:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrchestratorFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Env
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ["*"]

Outputs:
  WSUrl:
    Description: WebSocket URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}
  HttpBase:
    Description: HTTP API Base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}
  DocumentsBucketName:
    Description: S3 bucket name for manufacturing documents
    Value: !Ref DocumentsBucket
  RagEnabled:
    Description: Whether RAG infra was created in this deployment
    Value: !Ref EnableRagInfra
  OpenSearchDomainEndpoint:
    Condition: CreateRagInfra
    Description: OpenSearch domain endpoint (only if RAG enabled)
    Value: !GetAtt VectorSearchDomain.DomainEndpoint
  BedrockKBRoleArn:
    Condition: CreateRagInfra
    Description: IAM Role ARN for Bedrock Knowledge Base (only if RAG enabled)
    Value: !GetAtt BedrockKBRole.Arn